{% extends "base.html" %}

{% block title %}Team — JobMatrix{% endblock %}

{% block content %}
<section class="page-head">
    <div class="container">
        <span class="mono">Team</span>
        <h1 class="display lines"><span><span>Three people,</span></span><span><span><em>one matcher.</em></span></span></h1>
    </div>
</section>

<section>
    <div class="container">
        {% for m in team %}
        <article class="member person reveal">
            <span class="mono">0{{ loop.index }}</span>
            <div class="photo"><img src="{{ url_for('static', filename='images/' ~ m.photo) }}" alt="{{ m.name }}" loading="lazy"></div>
            <div class="info">
                <h2 class="h2">{{ m.name }}</h2>
                <span class="role small">{{ m.role }}</span>
                <p>{{ m.bio }}</p>
                <div class="links">
                    <a href="{{ m.github }}" target="_blank" rel="noopener"><span class="u">GitHub</span> <span class="arrow">↗</span></a>
                    <a href="{{ m.linkedin }}" target="_blank" rel="noopener"><span class="u">LinkedIn</span> <span class="arrow">↗</span></a>
                </div>
            </div>
        </article>
        {% endfor %}
    </div>
</section>

<section class="closing" style="padding-top:clamp(40px,6vw,80px)">
    <div class="container reveal">
        <h2 class="display">See the code.</h2>
        <a href="https://github.com/alamdilshad87/JobMatrix_NLP" target="_blank" rel="noopener" class="btn">GitHub <span class="arrow">↗</span></a>
    </div>
</section>
{% endblock %}
